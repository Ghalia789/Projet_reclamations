version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: reclamations-db
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: reclamations_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: reclamations-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/reclamations_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: secret
    ports:
      - "8087:8087"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: reclamations-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  db_data:
